<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero pickup and throw review</title>
<style>body{margin:0;background:#171323;color:#faf1de;font:16px system-ui}main{max-width:1250px;margin:auto;padding:28px}h1{margin:0 0 8px;color:#ffcc63}p{color:#ccc0d6}button,select,input{font:inherit}button,select{background:#342a45;color:#fff3d6;border:1px solid #98763a;border-radius:6px;padding:8px 14px}nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:24px 0}#roster{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}article{background:#262033;border:1px solid #5b496e;border-radius:10px;overflow:hidden;text-align:center}h2{font-size:19px;margin:14px 0 0}canvas{width:100%;height:auto;display:block}.phase{font-size:14px;margin:4px 0 14px;color:#f2c667}#strip{margin-top:24px;display:grid;gap:8px}.striprow{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}.striprow img{width:100%;height:180px;object-fit:contain;background:#eee7db}footer{margin-top:22px;font-size:14px;color:#c4b7cb}@media(max-width:800px){#roster{grid-template-columns:repeat(2,1fr)}}
</style><main><h1>Pick up • lift • throw</h1><p>Rikki, Tikki, Tavi, Bruno and Juno · Eight authored poses each · Sprite review</p><nav><button id="play">Pause</button><button id="flip">Face left</button><label>Frame <input id="scrub" type="range" min="0" max="7" value="0"></label><label><input id="prop" type="checkbox" checked> Show separate spice sack</label><label><input id="idle" type="checkbox"> Idle comparison</label><select id="back"><option value="dark">Dark background</option><option value="light">Light background</option></select></nav><section id="roster"></section><footer>Release: 420ms · Full sequence: 700ms · Preview pauses between repetitions. Prop flight is a demonstration; the new sprites are not yet connected to gameplay.</footer><details><summary>View all 40 frames</summary><div id="strip"></div></details></main>
<script type="module">
const manifest=await fetch('./manifest.json').then(r=>r.json());
const load=url=>new Promise((resolve,reject)=>{const i=new Image;i.onload=()=>resolve(i);i.onerror=reject;i.src=url;});
const heroes=Object.entries(manifest.characters),imgs={},idles={};
for(const [hero,data]of heroes){imgs[hero]=await Promise.all(data.frames.map(f=>load('../../'+f.url)));idles[hero]=await load('../../'+data.anatomicalReference);}
const sack=await load('../stage2/stage2_spice_sack.png');
const ctxs={};for(const [hero]of heroes){const a=document.createElement('article');a.innerHTML=`<h2>${hero[0].toUpperCase()+hero.slice(1)}</h2><canvas width="480" height="520" aria-label="${hero} throw animation"></canvas><div class="phase"></div>`;document.querySelector('#roster').append(a);ctxs[hero]=a.querySelector('canvas').getContext('2d');const row=document.createElement('div');row.className='striprow';for(const im of imgs[hero])row.append(im.cloneNode());document.querySelector('#strip').append(row);}
let playing=true,left=false,start=performance.now(),frame=0;const $=s=>document.querySelector(s);
$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'Pause':'Play';start=performance.now();};$('#flip').onclick=()=>{left=!left;$('#flip').textContent=left?'Face right':'Face left';};$('#scrub').oninput=()=>{playing=false;$('#play').textContent='Play';frame=+$('#scrub').value;};
function draw(now){const elapsed=(now-start)%1400;if(playing){let total=0;frame=7;for(let i=0;i<8;i++){total+=heroes[0][1].frames[i].duration;if(elapsed<total){frame=i;break;}}$('#scrub').value=frame;}
for(const [hero,data]of heroes){const c=ctxs[hero],f=data.frames[frame],s=f.renderScale,light=$('#back').value==='light';c.setTransform(2,0,0,2,0,0);c.fillStyle=light?'#ede7dc':'#201c2b';c.fillRect(0,0,240,260);c.strokeStyle=light?'#a79888':'#514561';c.beginPath();c.moveTo(0,222);c.lineTo(240,222);c.stroke();c.save();c.translate(120,220);if(left)c.scale(-1,1);
if($('#idle').checked){const ref=data.idleReference;c.globalAlpha=.22;c.drawImage(idles[hero],-ref.originX*ref.width*ref.renderScale,-ref.originY*ref.height*ref.renderScale,ref.width*ref.renderScale,ref.height*ref.renderScale);c.globalAlpha=1;}
c.drawImage(imgs[hero][frame],-f.originX*f.width*s,-f.originY*f.height*s,f.width*s,f.height*s);
if($('#prop').checked){let x=50,y=0;if(f.propHeld){x=(f.handSocket.x-f.originX*f.width)*s;y=(f.handSocket.y-f.originY*f.height)*s;}else if(frame>=5){const r=data.frames[5],age=playing?Math.min(.28,(elapsed-420)/1000):[0,.1,.2][frame-5];x=(r.handSocket.x-r.originX*r.width)*s+age*370;y=(r.handSocket.y-r.originY*r.height)*s-age*250+age*age*450;}c.drawImage(sack,x-18,y-36,36,36);}
c.restore();c.canvas.nextElementSibling.textContent=`${frame+1}/8 · ${f.phase}`;}
window.__throwReview={frame,left,playing,loaded:true,heroes:heroes.map(([h])=>h)};requestAnimationFrame(draw);}
requestAnimationFrame(draw);
</script></html>
