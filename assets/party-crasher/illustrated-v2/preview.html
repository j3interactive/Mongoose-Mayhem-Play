document.querySelector('#restart').onclick=()=>elapsed=0;
cycle.onchange=()=>elapsed=0;
document.querySelector('#step').onclick=()=>{paused=true;const {c,i}=frameAt();elapsed=c.durations.slice(0,(i+1)%c.frames.length).reduce((a,b)=>a+b,0);};
function draw(now){if(!paused)elapsed+=last?Math.min(now-last,80):0;last=now;const {f}=frameAt();ctx.fillStyle=document.querySelector('#backdrop').value;ctx.fillRect(0,0,1200,1000);ctx.strokeStyle='#987d5c';ctx.beginPath();ctx.moveTo(0,300);ctx.lineTo(1200,300);ctx.moveTo(0,900);ctx.lineTo(1200,900);ctx.stroke();if(art.complete&&art.naturalWidth)for(const [x,y,flip,zoom] of [[280,300,1,1],[850,300,-1,1],[280,900,1,2],[850,900,-1,2]]){const s=f.displayScale*zoom,r=f.atlas;ctx.save();ctx.translate(x,y);ctx.scale(s*flip,s);ctx.drawImage(art,r.x,r.y,r.width,r.height,-f.pivotX,-f.pivotY,f.width,f.height);ctx.restore();}document.querySelector('#readout').textContent=f.id+(paused?' · paused':'');requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script>
