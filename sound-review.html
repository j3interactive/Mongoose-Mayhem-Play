<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mongoose Mayhem · Original sound effects</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100b19;color:#f7e6cc;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:42px 24px 70px}h1{font-size:clamp(30px,5vw,55px);font-style:italic;color:#ffcf5a;margin:0 0 12px}p{color:#cbb8d6;line-height:1.6;max-width:750px}header{border-bottom:2px solid #b58245;padding-bottom:25px}#tools{position:sticky;top:0;background:#100b19f5;padding:16px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap;z-index:2}button{cursor:pointer;background:#72253c;color:#fff1ce;border:1px solid #d8a54a;border-radius:5px;padding:10px 14px;font:inherit}button:hover{background:#97334e}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #66e0de;outline-offset:3px}button:disabled{opacity:.4;cursor:wait}label{display:flex;align-items:center;gap:10px}input{accent-color:#ffcf5a}h2{font-style:italic;color:#ffdf9a;margin-top:34px;font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.card{background:#21152d;border:1px solid #634263;border-radius:7px;padding:16px}.card h3{margin:0 0 7px;font-size:17px}.card small{color:#bdaac7;display:block;margin-bottom:14px}.actions{display:flex;gap:8px}.actions button{font-size:13px;padding:8px 12px}.download{background:#21152d}#status{color:#79e1d8;min-height:25px}a{color:#ffcf5a}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style></head><body><main><header><p>MONGOOSE MAYHEM / SOUND STUDIO</p><h1>MAKE SOME NOISE.</h1><p id="intro">Original effects designed for the crew, combat and streets of Sundara. Select a sound to audition its variations, or play the full set.</p><a href="./">← Back to the game</a></header><div id="tools"><button id="all" disabled>PLAY ALL</button><button id="stop">STOP</button><label>Volume <input aria-label="Preview volume" id="volume" type="range" min="0" max="100" value="60"></label></div><p id="status" role="status">Loading the sound library…</p><div id="library"></div></main>
<script type="module">
const data=await fetch('assets/audio/manifest.json').then(r=>{if(!r.ok)throw Error('Library unavailable');return r.json();});
const raw=await fetch(data.url).then(r=>{if(!r.ok)throw Error('Sound bank unavailable');return r.arrayBuffer();});
let ctx,bank,gain,voice,run=0;const versions=new Map(),status=document.querySelector('#status');
async function ready(){if(!ctx){ctx=new AudioContext();gain=ctx.createGain();gain.gain.value=Number(document.querySelector('#volume').value)/100;gain.connect(ctx.destination);bank=await ctx.decodeAudioData(raw.slice(0));}await ctx.resume();}
function stop(){run++;if(voice){try{voice.stop();}catch{}voice=null;}status.textContent='Stopped.';}
async function play(name,index){await ready();if(voice){try{voice.stop();}catch{}}const cue=data.cues[name],v=cue.versions[index%cue.versions.length];voice=ctx.createBufferSource();const level=ctx.createGain();level.gain.value=cue.volume;voice.buffer=bank;voice.connect(level);level.connect(gain);voice.onended=()=>{level.disconnect();};voice.start(0,v.offset,v.duration);status.textContent=`${name.replaceAll('_',' ')} · variation ${index%cue.versions.length+1} of ${cue.versions.length}`;return v.duration;}
function download(name){const cue=data.cues[name],v=cue.versions[0],pcm=new Uint8Array(raw,44+Math.round(v.offset*data.sampleRate)*2,Math.round(v.duration*data.sampleRate)*2);const header=raw.slice(0,44),view=new DataView(header);view.setUint32(4,36+pcm.length,true);view.setUint32(40,pcm.length,true);const url=URL.createObjectURL(new Blob([header,pcm],{type:'audio/wav'})),a=document.createElement('a');a.href=url;a.download=`mongoose-${name}.wav`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const groups=new Map();for(const [name,cue]of Object.entries(data.cues)){if(!groups.has(cue.group))groups.set(cue.group,[]);groups.get(cue.group).push([name,cue]);}
for(const [group,cues]of groups){const h=document.createElement('h2');h.textContent=group;const grid=document.createElement('div');grid.className='grid';document.querySelector('#library').append(h,grid);for(const[name,cue]of cues){const card=document.createElement('article');card.className='card';const title=document.createElement('h3');title.textContent=name.replaceAll('_',' ').replace(/^./,c=>c.toUpperCase());const meta=document.createElement('small');meta.textContent=`${cue.versions[0].duration.toFixed(2)}s · ${cue.versions.length} variation${cue.versions.length===1?'':'s'}`;const actions=document.createElement('div');actions.className='actions';const audition=document.createElement('button');audition.textContent='▶ PLAY';audition.onclick=()=>{stop();const i=versions.get(name)??0;versions.set(name,i+1);play(name,i);};const save=document.createElement('button');save.textContent='WAV ↓';save.className='download';save.setAttribute('aria-label',`Download ${title.textContent}`);save.onclick=()=>download(name);actions.append(audition,save);card.append(title,meta,actions);grid.append(card);}}
document.querySelector('#stop').onclick=stop;document.querySelector('#volume').oninput=e=>{if(gain)gain.gain.value=Number(e.target.value)/100;};
document.querySelector('#all').disabled=false;document.querySelector('#all').onclick=async()=>{stop();await ready();const token=++run;for(const name of Object.keys(data.cues)){if(token!==run)return;const duration=await play(name,0);await new Promise(r=>setTimeout(r,(duration+.22)*1000));}if(token===run)status.textContent='All effects played.';};
status.textContent=`${Object.keys(data.cues).length} original effects · ${Object.values(data.cues).reduce((n,c)=>n+c.versions.length,0)} variations · 44.1 kHz WAV`;
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
</script></body></html>
